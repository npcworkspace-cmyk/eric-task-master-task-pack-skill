name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python 3.11 / Node 22
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install test-only Python dependency
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Validate release trees
        run: python tools/skillkit.py validate --all --strict
      - name: Run Skill behavior and audit evidence tests
        run: python tools/skillkit.py test --all
      - name: Run repository tool tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate TikTok bundle and isolated installation
        run: python tools/tiktok_bundle.py validate

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build deterministic assets
        run: python tools/skillkit.py package --all --output dist
      - name: Build deterministic TikTok bundle
        run: python tools/tiktok_bundle.py package --output dist
      - name: Create or resume draft release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $GITHUB_REF_NAME is already public; refusing to replace its assets."
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "Eric Task Master Task Pack Skills $GITHUB_REF_NAME"
          fi
      - name: Upload verified assets to draft
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
      - name: Publish release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
